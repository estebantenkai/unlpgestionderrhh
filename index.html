<style>
:root{
  --pet:#005F61; --pet-d:#00484A; --azul:#1F3A5F; --salvia:#7FA8A2; --salvia-l:#E1EBE8;
  --papel:#F4F2EE; --blanco:#FFFFFF; --tinta:#1C2B2A; --sub:#4E5C59; --muted:#7E8A87;
  --linea:#D9D6CE; --error:#A23B2A; --aviso:#7A5300; --aviso-bg:#FBF1DA;
  --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans:'Public Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--salvia);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--linea);background:var(--blanco);color:var(--tinta);border-radius:8px;padding:10px 18px;font-weight:600;font-size:15px;line-height:1.3;text-decoration:none}
.btn:hover{border-color:var(--salvia)}
.btn.primario{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.primario:hover{background:#17304F}
.btn.pet{background:var(--pet);border-color:var(--pet);color:#fff}
.btn[disabled]{opacity:.6;cursor:wait}
.link{background:none;border:0;padding:0;color:var(--pet);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.input{width:100%;padding:12px 14px;border:1px solid var(--linea);border-radius:8px;background:var(--blanco)}
.input:focus{outline:none;border-color:var(--pet);box-shadow:0 0 0 3px rgba(0,95,97,.15)}
.error{color:var(--error);font-size:14px;min-height:22px;margin:10px 0 0}
.ayuda{color:var(--sub);font-size:15px}

/* Ingreso */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.login-marca{background:var(--pet);color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-logo{width:170px;height:auto;display:block}
.login-materia{margin:0;font-size:15px;opacity:.85}
.login-marca h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,4.2vw,54px);line-height:1.08;margin:10px 0 18px;max-width:12ch;letter-spacing:-.01em}
.login-bajada{font-family:var(--serif);font-size:20px;margin:0;opacity:.92;max-width:26ch}
.login-docentes{font-size:14px;margin:0;opacity:.85}
.login-docentes strong{display:block;font-size:16px;opacity:1}
.login-form{display:flex;flex-direction:column;justify-content:center;padding:48px 56px;width:100%;max-width:560px;margin:0 auto}
.login-form h2{font-family:var(--serif);font-size:28px;color:var(--azul);margin:0 0 8px;font-weight:600}
.login-form label{display:block;font-weight:600;font-size:14px;margin:20px 0 6px}
.login-form .btn{margin-top:18px;width:100%;padding:13px}
.cargando{min-height:100vh;display:grid;place-items:center;color:var(--sub)}

/* Quién escribe */
.quien{min-height:100vh;display:grid;place-items:center;padding:24px}
.quien-caja{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;max-width:560px;width:100%;padding:36px}
.quien-caja h1{font-family:var(--serif);color:var(--azul);font-size:30px;margin:0 0 4px;font-weight:600}
.quien-lista{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
.quien-lista .btn{font-weight:500}
.quien-nuevo{border-top:1px solid var(--linea);margin-top:22px;padding-top:18px}
.quien-nuevo label{font-weight:600;font-size:15px;display:block;margin-bottom:8px}
.fila{display:flex;gap:10px}
.fila .input{flex:1}

/* Barra */
.barra{position:sticky;top:0;z-index:20;background:var(--pet);color:#fff}
.barra-in{display:flex;align-items:center;gap:18px;padding:10px 28px;max-width:1240px;margin:0 auto}
.barra-logo{height:50px;width:auto;display:block}
.barra-titulo{flex:1;min-width:0;line-height:1.25}
.barra-titulo strong{display:block;font-family:var(--serif);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-titulo span{font-size:13px;opacity:.85}
.barra-der{display:flex;align-items:center;gap:14px}
.estado{font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.estado::before{content:'';width:9px;height:9px;border-radius:50%;background:#9FD8C9;flex:0 0 9px}
.estado[data-e="pending"]::before,.estado[data-e="saving"]::before{background:#F2C14E}
.estado[data-e="offline"]::before,.estado[data-e="conflicto"]::before{background:#F28B6B}
.chip-grupo{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600;text-align:left;line-height:1.25}
.chip-grupo small{display:block;font-weight:400;opacity:.85;font-size:12px}
.chip-grupo:hover{background:rgba(255,255,255,.2)}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
.menu summary::-webkit-details-marker{display:none}
.menu summary:hover{background:rgba(255,255,255,.12)}
.menu-panel{position:absolute;right:0;top:46px;background:var(--blanco);color:var(--tinta);border:1px solid var(--linea);border-radius:10px;min-width:250px;padding:6px;box-shadow:0 10px 30px rgba(0,40,40,.18)}
.menu-panel button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:6px;font-size:15px}
.menu-panel button:hover{background:var(--papel)}
.menu-panel hr{border:0;border-top:1px solid var(--linea);margin:6px 0}
.menu-panel .quien-soy{font-size:13px;color:var(--sub);padding:8px 12px 4px}

/* Sendero */
.sendero{background:var(--pet-d);overflow-x:auto;scrollbar-width:thin}
.sendero-in{display:flex;max-width:1240px;margin:0 auto;padding:10px 20px 8px;min-width:760px}
.parada{flex:1 1 0;background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;padding:4px 2px}
.parada::before{content:'';position:absolute;top:21px;right:50%;width:100%;height:2px;background:rgba(255,255,255,.22)}
.parada:first-child::before{display:none}
.parada.hecha::before,.parada.actual::before{background:rgba(255,255,255,.55)}
.parada .c{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;position:relative;z-index:1;border:2px solid rgba(255,255,255,.55);background:var(--pet-d)}
.parada .c svg{width:15px;height:15px}
.parada.hecha .c{background:#fff;color:var(--pet);border-color:#fff}
.parada.actual .c{background:var(--papel);color:var(--azul);border-color:var(--papel);box-shadow:0 0 0 4px rgba(255,255,255,.28)}
.parada.bloq .c{border-style:dashed;border-color:rgba(255,255,255,.35);color:rgba(255,255,255,.6)}
.parada .l{font-size:12px;line-height:1.2;opacity:.8;white-space:nowrap}
.parada.actual .l{opacity:1;font-weight:700}
.parada.bloq .l{opacity:.55}
.parada:hover .c{border-color:#fff}

/* Contenido */
.contenido{max-width:880px;margin:0 auto;padding:44px 28px 96px}
.etapa-num{color:var(--pet);font-weight:600;font-size:15px;margin:0}
.etapa h1{font-family:var(--serif);font-size:clamp(30px,4.2vw,44px);line-height:1.12;margin:6px 0 30px;font-weight:600;color:var(--azul);letter-spacing:-.01em}
.intro{font-size:17px;color:var(--sub);margin:-12px 0 30px;max-width:68ch}
.expediente{margin:0 0 30px}
.expediente-pestana{display:inline-flex;align-items:baseline;gap:8px;background:var(--pet);color:#fff;font-weight:600;font-size:14px;padding:7px 16px 6px;border-radius:9px 9px 0 0}
.expediente-pestana span{font-family:var(--serif);font-size:20px;line-height:1}
.expediente-cuerpo{background:var(--blanco);border:1px solid var(--linea);border-top:3px solid var(--pet);border-radius:0 12px 12px 12px;padding:30px 36px 18px;font-family:var(--serif);font-size:18.5px;line-height:1.72}
.expediente-cuerpo p{margin:0 0 1em;max-width:66ch}
.expediente-cuerpo ul{margin:0 0 1em;padding-left:1.2em;max-width:66ch}
.expediente-cuerpo li{margin:0 0 .7em}
.conceptos{background:var(--salvia-l);border-radius:12px;margin:0 0 44px}
.conceptos summary{padding:16px 22px;font-weight:600;cursor:pointer;color:var(--pet-d);display:flex;justify-content:space-between;align-items:center;list-style:none}
.conceptos summary::-webkit-details-marker{display:none}
.conceptos summary::after{content:'+';font-size:22px;font-weight:400;line-height:1}
.conceptos[open] summary::after{content:'–'}
.conceptos .cuerpo{padding:2px 22px 18px}
.conceptos h3{font-size:16px;margin:14px 0 4px;color:var(--azul)}
.conceptos p{margin:0 0 6px;font-size:15.5px;max-width:72ch}
.bloque{margin:0 0 44px}
.bloque > h2{font-family:var(--serif);font-size:26px;color:var(--azul);margin:0 0 6px;font-weight:600}
.bloque > .ayuda{margin:0 0 10px}
.campo{margin:22px 0 30px}
.campo > label{display:flex;gap:12px;font-size:16.5px;font-weight:600;line-height:1.45;margin:0 0 10px}
.campo-num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:13px;margin-top:-1px}
.campo textarea{display:block;width:100%;min-height:110px;border:1px solid var(--linea);border-radius:9px;background:var(--blanco);padding:14px 16px;line-height:1.6;resize:vertical;overflow:hidden}
.campo textarea.corto{min-height:50px}
.campo textarea:focus{border-color:var(--pet);outline:none;box-shadow:0 0 0 3px rgba(0,95,97,.15)}
.campo textarea[readonly]{background:#F7F6F2;color:var(--sub)}
.campo textarea::placeholder{color:#A3ACA9}
.meta{font-size:13px;color:var(--muted);margin-top:6px;min-height:20px}
.meta.aviso{color:var(--aviso);background:var(--aviso-bg);border-radius:6px;padding:6px 10px}
.entrevista{background:var(--blanco);border:1px dashed var(--salvia);border-radius:12px;padding:22px 24px 4px;margin:0 0 44px}
.entrevista h2{font-family:var(--serif);font-size:22px;color:var(--azul);margin:0;font-weight:600}
.seccion-informe{border-top:1px solid var(--linea);padding-top:22px;margin-top:10px}
.seccion-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.seccion-cab h2{font-family:var(--serif);font-size:23px;color:var(--azul);margin:0;font-weight:600}
.seccion-cab .btn{font-size:14px;padding:8px 14px;font-weight:500}
.seccion-informe .campo{margin-top:12px}
.exportar{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:22px 24px;margin:20px 0 0}
.exportar h2{font-family:var(--serif);font-size:22px;color:var(--azul);margin:0 0 6px;font-weight:600}
.exportar .acciones{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.persona{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:22px 24px 2px;margin:0 0 18px}
.persona.mia{border-color:var(--pet);border-width:2px}
.persona h3{margin:0;font-size:19px;font-family:var(--serif);color:var(--azul);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.persona h3 small{font-family:var(--sans);font-size:13px;color:var(--pet);font-weight:600}
.persona .campo > label{font-size:15.5px}
.nav-etapas{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:26px;border-top:1px solid var(--linea);flex-wrap:wrap}

/* Modales y avisos */
.modal-fondo{position:fixed;inset:0;background:rgba(15,32,32,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal{background:var(--blanco);border-radius:14px;max-width:580px;width:100%;max-height:90vh;overflow:auto;padding:30px 30px 26px;position:relative}
.modal h2{font-family:var(--serif);color:var(--azul);margin:0 0 8px;font-size:25px;font-weight:600;padding-right:30px}
.modal .cerrar{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:8px;border:0;background:none;font-size:24px;line-height:1;color:var(--sub)}
.modal .cerrar:hover{background:var(--papel)}
.modal .acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.version{background:var(--papel);border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:14.5px;max-height:190px;overflow:auto;margin:6px 0 16px;border:1px solid var(--linea)}
.version-tit{font-size:14px;font-weight:600;margin:12px 0 0}
.lista-integ{list-style:none;padding:0;margin:14px 0}
.lista-integ li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea)}
.lista-integ li button{background:none;border:0;color:var(--error);font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--azul);color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;z-index:70;max-width:calc(100% - 40px);box-shadow:0 8px 24px rgba(0,0,0,.2)}

@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-marca{padding:28px 24px;gap:22px}
  .login-marca h1{max-width:none}
  .login-form{padding:28px 24px 48px}
  .barra-in{padding:8px 14px;gap:10px}
  .barra-logo{height:36px}
  .barra-titulo span{display:none}
  .barra-titulo strong{font-size:16px}
  .estado span{display:none}
  .contenido{padding:30px 18px 80px}
  .expediente-cuerpo{padding:22px 20px 10px;font-size:17px}
  .quien-caja{padding:24px}
}
@media (max-width:560px){
  .barra-titulo{display:none}
  .barra-der{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* Impresión */
#print{display:none}
@media print{
  @page{size:A4;margin:18mm 17mm}
  body{background:#fff}
  #app,#modal-root,#toast-root{display:none!important}
  #print{display:block;font-family:var(--serif);color:#1C2B2A;font-size:11.5pt;line-height:1.55}
  .p-portada{page-break-after:always}
  .p-banda{background:#005F61;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:18px 22px;border-radius:6px}
  .p-banda img{height:96px;display:block}
  .p-materia{font-family:var(--sans);font-size:10.5pt;color:#005F61;margin:0 0 4px;padding-top:120px;font-weight:600}
  #print h1{font-size:30pt;line-height:1.1;color:#1F3A5F;margin:0 0 10px;font-weight:600}
  .p-sub{font-size:14pt;color:#4E5C59;margin:0 0 40px}
  .p-datos{font-family:var(--sans);font-size:10.5pt;border-top:1px solid #D9D6CE}
  .p-datos div{display:flex;gap:16px;padding:9px 0;border-bottom:1px solid #D9D6CE}
  .p-datos dt{width:110px;color:#7E8A87;flex:0 0 110px}
  .p-datos dd{margin:0}
  #print h2{font-size:17pt;color:#005F61;margin:26px 0 8px;font-weight:600;page-break-after:avoid}
  #print h3{font-family:var(--sans);font-size:10.5pt;color:#1F3A5F;margin:16px 0 4px;page-break-after:avoid}
  #print p{margin:0 0 8px;orphans:3;widows:3}
  .p-vacio{color:#9AA3A0;font-style:italic}
  .p-salto{page-break-before:always}
  .p-num{font-family:var(--sans);font-size:10pt;color:#005F61;font-weight:600;margin:0}
  .p-persona{border-top:1px solid #D9D6CE;margin-top:14px;padding-top:6px;page-break-inside:avoid}
}
</style>

  grupo: null, codigo: null, autor: null, etapa: 1,
  resp: {}, des: ['1'], pending: {},
  guardando: false, reintentos: 0, tGuardar: null, tPersistir: null, tLectura: null,
  conflictos: [], removidos: {}, online: true

/* ============ Utilidades ============ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function claveCache() { return CLAVE + ':grupo-' + S.grupo; }
function hayPendientes() { return Object.keys(S.pending).length > 0; }
function pendientesActivos() { return Object.keys(S.pending).filter(function (k) { return !S.pending[k].conflicto; }); }

function normCodigo(c) {
  c = String(c || '').trim().toUpperCase().replace(/\s+/g, '');
  if (c && c.indexOf('RH-') !== 0) c = 'RH-' + c.replace(/^RH/, '');
  return c;
}
function slug(n) {
  return String(n).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30) || 'persona';
}
function fechaCorta(ts) {
  if (!ts) return '';
  var d = new Date(ts), hoy = new Date();
  var hh = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  if (d.toDateString() === hoy.toDateString()) return 'hoy, ' + hh;
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ', ' + hh;
}
function valor(c) {
  if (S.pending[c]) return S.pending[c].valor;
  return S.resp[c] ? S.resp[c].v : '';
}
function tsActual(c) { return S.resp[c] ? S.resp[c].t : 0; }
function integrantes() {
  try { var a = JSON.parse(valor('integrantes') || '[]'); return Array.isArray(a) ? a.filter(Boolean) : []; }
  catch (e) { return []; }
}
function desbloqueada(n) {
  n = Number(n);
  if (n <= 6) return S.des.indexOf(String(n)) >= 0;
  return S.des.indexOf('6') >= 0;
}
function etapa(n) { return ETAPAS[n - 1]; }
function camposDeClase(e) {
  var ids = (e.entrevista || []).map(function (p) { return p[0]; });
  return ids.concat(e.preguntas.map(function (p) { return p[0]; }), ['c' + e.n + '_dejo']);
}
function tieneContenido(n) {
  var e = etapa(n);
  var ids = [];
  if (e.tipo === 'clase') ids = camposDeClase(e);
  else if (e.tipo === 'informe') ids = e.secciones.map(function (s) { return s[0]; });
  else {
    ids = e.grupales.map(function (g) { return g[0]; });
    integrantes().forEach(function (p) { e.individuales.forEach(function (q) { ids.push('ind_' + slug(p) + '_' + q[0]); }); });
  }
  return ids.some(function (id) { return String(valor(id)).trim().length > 0; });
}
function parrafosHTML(t) {
  return String(t).trim().split(/\n\s*\n/).map(function (p) {
    return '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}
function toast(msg, ms) {
  var r = document.getElementById('toast-root');
  r.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>';
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { r.innerHTML = ''; }, ms || 3500);
}

/* ============ Persistencia local ============ */
function persistir() {
  if (!S.grupo) return;
  lsSet(claveCache(), { codigo: S.codigo, resp: S.resp, des: S.des, pending: S.pending });
  lsSet(CLAVE + ':sesion', { grupo: S.grupo, codigo: S.codigo, autor: S.autor, etapa: S.etapa });
}
function persistirPronto() { clearTimeout(S.tPersistir); S.tPersistir = setTimeout(persistir, 400); }
function limpiarPendientes(p) {
  var out = {};
  Object.keys(p || {}).forEach(function (k) { out[k] = { valor: p[k].valor, base: p[k].base || 0 }; });
  return out;
}

/* ============ Comunicación con el servidor ============ */
function api(accion, extra, metodo) {
  var p = { accion: accion, grupo: S.grupo, codigo: S.codigo };
  Object.keys(extra || {}).forEach(function (k) { p[k] = extra[k]; });
  var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var to = setTimeout(function () { if (ctrl) ctrl.abort(); }, 25000);
  var req;
  if (metodo === 'GET') {
    var q = Object.keys(p).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(p[k]); }).join('&');
    req = fetch(API + '?' + q + '&_=' + Date.now(), { method: 'GET', redirect: 'follow', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
  } else {
    req = fetch(API, { method: 'POST', redirect: 'follow', body: JSON.stringify(p), signal: ctrl ? ctrl.signal : undefined });
  }
  return req.then(function (r) {
    clearTimeout(to);
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }, function (e) { clearTimeout(to); throw e; });
}

/* ============ Estado de guardado ============ */
function estado(e) {
  var el = $('#estado');
  if (!el) return;
  var hayConf = Object.keys(S.pending).some(function (k) { return S.pending[k].conflicto; });
  if (!e) {
    if (hayConf) e = 'conflicto';
    else if (!S.online) e = 'offline';
    else if (hayPendientes()) e = 'pending';
    else e = 'ok';
  }
  var txt = {
    ok: 'Todo guardado',
    pending: 'Cambios sin guardar',
    saving: 'Guardando…',
    offline: 'Sin conexión: los cambios quedan en este equipo',
    conflicto: 'Hay una respuesta para revisar'
  }[e];
  el.setAttribute('data-e', e);
  el.setAttribute('title', txt);
  el.innerHTML = '<span>' + esc(txt) + '</span>';
}

/* ============ Guardado ============ */
function marcarCambio(campo, val, base) {
  var p = S.pending[campo];
  if (p) { p.valor = val; }
  else { S.pending[campo] = { valor: val, base: base }; }
  persistirPronto();
  estado();
  programarGuardado(ESPERA_GUARDADO);
}
function programarGuardado(ms) {
  clearTimeout(S.tGuardar);
  S.tGuardar = setTimeout(guardar, ms);
}

function guardar() {
  if (S.guardando || !S.grupo || !S.autor) return Promise.resolve();
  var campos = pendientesActivos();
  if (!campos.length) { estado(); return Promise.resolve(); }
  S.guardando = true;
  estado('saving');
  var envio = campos.map(function (c) {
    var p = S.pending[c];
    return { campo: c, valor: p.valor, base: p.base || 0, forzar: !!p.forzar };
  });
  return api('guardar', { autor: S.autor, cambios: envio }).then(function (r) {
    if (!r || !r.ok) {
      if (r && r.error === 'acceso') { S.guardando = false; accesoInvalido(); return; }
      throw new Error(r ? r.error : 'sin respuesta');
    }
    S.online = true; S.reintentos = 0;
    envio.forEach(function (e) {
      var ts = r.guardados && r.guardados[e.campo];
      if (!ts) return;
      S.resp[e.campo] = { v: e.valor, a: S.autor, t: ts };
      var p = S.pending[e.campo];
      if (p && p.valor === e.valor) delete S.pending[e.campo];
      else if (p) { p.base = ts; p.forzar = false; }
      var el = campoEl(e.campo);
      if (el) el.setAttribute('data-t', ts);
      actualizarMeta(e.campo);
    });
    var reenviar = false;
    (r.conflictos || []).forEach(function (c) {
      if (c.error === 'largo') {
        delete S.pending[c.campo];
        toast('Una respuesta superó el largo máximo permitido y no se guardó. Acortala y volvé a intentar.', 6000);
        return;
      }
      if (c.campo === 'integrantes') { fusionarIntegrantes(c); reenviar = true; return; }
      S.resp[c.campo] = { v: c.v, a: c.a, t: c.t };
      if (S.pending[c.campo]) S.pending[c.campo].conflicto = true;
      S.conflictos.push(c);
    });
    S.guardando = false;
    persistir();
    estado();
    if (envio.some(function (e) { return e.campo === 'integrantes' || e.campo === 'grupo_nombre'; }) || reenviar) pintarGrupo();
    if (S.conflictos.length) mostrarConflicto();
    if (reenviar || pendientesActivos().length) programarGuardado(reenviar ? 200 : 900);
  }).catch(function () {
    S.guardando = false;
    S.online = false;
    S.reintentos = Math.min(S.reintentos + 1, 6);
    persistir();
    estado();
    programarGuardado([3, 6, 12, 20, 30, 30][S.reintentos - 1] * 1000);
  });
}

function fusionarIntegrantes(c) {
  var servidor = [];
  try { servidor = JSON.parse(c.v || '[]'); } catch (e) {}
  var mio = [];
  try { mio = JSON.parse(S.pending.integrantes ? S.pending.integrantes.valor : '[]'); } catch (e) {}
  var lista = [];
  servidor.concat(mio).forEach(function (n) {
    if (!n || S.removidos[n]) return;
    if (!lista.some(function (x) { return x.toLowerCase() === n.toLowerCase(); })) lista.push(n);
  });
  S.resp.integrantes = { v: c.v, a: c.a, t: c.t };
  S.pending.integrantes = { valor: JSON.stringify(lista), base: c.t, forzar: true };
}

/* Envío de emergencia al cerrar la pestaña */
function envioDeEmergencia() {
  var campos = pendientesActivos();
  persistir();
  if (!campos.length || !S.autor || !navigator.sendBeacon) return;
  var p = {
    accion: 'guardar', grupo: S.grupo, codigo: S.codigo, autor: S.autor,
    cambios: campos.map(function (c) { return { campo: c, valor: S.pending[c].valor, base: S.pending[c].base || 0 }; })
  };
  try { navigator.sendBeacon(API, new Blob([JSON.stringify(p)], { type: 'text/plain;charset=utf-8' })); } catch (e) {}
}
window.addEventListener('pagehide', envioDeEmergencia);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') envioDeEmergencia();
  else if (S.grupo && S.autor) { leer(); }
});

/* ============ Lectura periódica ============ */
function iniciarLectura() {
  detenerLectura();
  S.tLectura = setInterval(function () { if (!document.hidden) leer(); }, INTERVALO_LECTURA);
}
function detenerLectura() { clearInterval(S.tLectura); S.tLectura = null; }

function leer() {
  if (!S.grupo || S.guardando) return Promise.resolve();
  return api('leer', {}, 'GET').then(function (r) {
    if (!r || !r.ok) {
      if (r && r.error === 'acceso') accesoInvalido();
      return;
    }
    var estabaOffline = !S.online;
    S.online = true;
    aplicarServidor(r.respuestas || {});
    actualizarDesbloqueos(r.desbloqueadas || ['1']);
    persistir();
    estado();
    if (estabaOffline && pendientesActivos().length) programarGuardado(300);
  }).catch(function () { S.online = false; estado(); });
}

function aplicarServidor(resp) {
  var cambioInteg = false;
  Object.keys(resp).forEach(function (c) {
    var s = resp[c], l = S.resp[c];
    if (l && l.t >= s.t) return;
    S.resp[c] = s;
    if (c === 'integrantes' || c === 'grupo_nombre') cambioInteg = true;
    if (S.pending[c]) { avisoRemoto(c, s); return; }
    var el = campoEl(c);
    if (!el) return;
    if (el === document.activeElement) { avisoRemoto(c, s); return; }
    el.value = s.v;
    el.setAttribute('data-t', s.t);
    autoAlto(el);
    actualizarMeta(c);
  });
  if (cambioInteg) {
    pintarGrupo();
    var activo = document.activeElement;
    var escribiendo = activo && activo.tagName === 'TEXTAREA';
    if (S.etapa === 8 && !escribiendo) pintarEtapa(true);
    if (S.autor && integrantes().indexOf(S.autor) < 0 && !S.pending.integrantes) {
      toast('Tu nombre ya no figura en el grupo. Elegilo de nuevo para seguir.', 5000);
      S.autor = null; persistir(); pantallaQuien();
    }
  }
}

function actualizarDesbloqueos(lista) {
  var nuevas = lista.filter(function (x) { return S.des.indexOf(String(x)) < 0; });
  S.des = lista.map(String);
  if (nuevas.length) {
    pintarSendero();
    toast(nuevas.length === 1 ? 'Se abrió la clase ' + nuevas[0] + ' para el grupo.' : 'Se abrieron nuevas clases para el grupo.');
  }
}

function campoEl(c) { return document.querySelector('[data-campo="' + c + '"]'); }
function actualizarMeta(c) {
  var m = document.getElementById('m-' + c);
  if (!m) return;
  m.className = 'meta';
  var r = S.resp[c];
  m.textContent = r && String(r.v).trim() ? 'Última edición: ' + r.a + ', ' + fechaCorta(r.t) : '';
}
function avisoRemoto(c, s) {
  var m = document.getElementById('m-' + c);
  if (!m) return;
  m.className = 'meta aviso';
  m.textContent = s.a + ' actualizó esta respuesta mientras escribías. Al guardar vas a poder elegir qué versión queda.';
}

      '</section>' +
    '</main>';
  var btn = $('#l-entrar');
  function go() {

    if (!c.trim()) { $('#l-error').textContent = 'Ingresá el código de acceso del grupo.'; $('#l-codigo').focus(); return; }
    btn.disabled = true; btn.textContent = 'Conectando…';
    entrar(g, c).then(function (ok) { if (!ok) { btn.disabled = false; btn.textContent = 'Entrar'; } });
  }

}

function entrar(grupo, codigo) {
  S.grupo = String(grupo);
  S.codigo = normCodigo(codigo);
  S.conflictos = []; S.removidos = {};
  var cache = lsGet(claveCache());
  var mismoCodigo = cache && cache.codigo === S.codigo;
  return api('entrar', {}).then(function (r) {
    if (!r || !r.ok) {
      if (r && r.error === 'acceso') {
        errorIngreso('El grupo o el código no coinciden. Revisalos con la docente.');
        return false;
      }
      throw new Error('servidor');
    }
    S.resp = r.respuestas || {};
    S.des = (r.desbloqueadas || ['1']).map(String);
    S.pending = mismoCodigo ? limpiarPendientes(cache.pending) : {};
    S.online = true;
    return continuarIngreso();
  }).catch(function () {
    if (mismoCodigo) {
      S.resp = cache.resp || {};
      S.des = cache.des || ['1'];
      S.pending = limpiarPendientes(cache.pending);
      S.online = false;
      toast('Sin conexión con el servidor. Podés seguir trabajando: los cambios se envían cuando vuelva la conexión.', 6000);
      return continuarIngreso();
    }
    errorIngreso('No pudimos conectarnos con el servidor. Revisá tu conexión. Si estás en una red de trabajo, probá desde el celular.');
    return false;
  });
}
function errorIngreso(msg) {
  S.grupo = null;
  if ($('#l-error')) $('#l-error').textContent = msg;
  else pantallaIngreso(msg);
}
function continuarIngreso() {
  var ses = lsGet(CLAVE + ':sesion') || {};
  var mismo = String(ses.grupo) === S.grupo;
  S.autor = mismo && ses.autor && integrantes().indexOf(ses.autor) >= 0 ? ses.autor : null;
  S.etapa = mismo && ses.etapa ? Number(ses.etapa) : 1;
  if (!desbloqueada(S.etapa)) S.etapa = 1;
  persistir();
  if (S.autor) pantallaPrincipal(); else pantallaQuien();
  return true;
}
function accesoInvalido() {
  detenerLectura();
  lsDel(CLAVE + ':sesion');
  S.grupo = null;
  pantallaIngreso('El código de acceso del grupo cambió. Pediselo de nuevo a la docente.');
}
function salir() {
  var fin = function () {
    detenerLectura();
    var ses = lsGet(CLAVE + ':sesion') || {};
    lsSet(CLAVE + ':sesion', { grupo: ses.grupo, codigo: '' });
    S.grupo = null; S.autor = null;
    pantallaIngreso();
  };
  if (pendientesActivos().length) guardar().then(fin, fin); else fin();
}

  function sumar() {
    var n = $('#q-nombre').value.replace(/\s+/g, ' ').trim();

}

function pintarSendero() {
  var s = $('#sendero');

  s.innerHTML = ETAPAS.map(function (e) {
    var ab = desbloqueada(e.n);

function irA(n) {
  if (!desbloqueada(n)) { modalClave(n); return; }

  persistir();
  pintarSendero();
  pintarEtapa();
  window.scrollTo(0, 0);
}

/* ============ Campos ============ */

  opts = opts || {};

      campoHTML(s[0], 'Texto de la sección', { filas: 8, ph: s[2] ? 'Escriban la sección o traigan lo trabajado en la clase como punto de partida' : 'Escriban la sección' }) + '</div>';
  }).join('');
  return '<article class="etapa">' +
    '<p class="etapa-num">Entrega final</p>' +
    '<h1>' + esc(e.titulo) + '</h1>' +
    '<p class="intro">El informe une el análisis de los seis episodios en una sola narrativa. Pueden traer lo que respondieron en cada clase como borrador y reescribirlo para que se lea como un único texto, con una línea argumental de principio a fin.</p>' +
    '<section class="bloque">' + campoHTML('inf_titulo', 'Título del informe', { filas: 1, ph: 'Por ejemplo: Litoral 2.0, entre la tradición y la innovación' }) + '</section>' +
    secciones +
    '<section class="exportar"><h2>Descargar</h2>' +
      '<p class="ayuda">Se abre la ventana de impresión. En destino, elegí «Guardar como PDF».</p>' +
      '<div class="acciones"><button class="btn pet" data-imprimir="informe">Descargar informe (PDF)</button>' +
      '<button class="btn" data-imprimir="completo">Descargar bitácora completa (PDF)</button></div>' +
    '</section>' +
  '</article>';
}

function htmlCierre(e) {
  var lista = integrantes();
  var personas = lista.map(function (p) {
    var mia = p === S.autor;
    return '<div class="persona' + (mia ? ' mia' : '') + '"><h3>' + esc(p) + (mia ? '<small>Tu reflexión</small>' : '') + '</h3>' +
      e.individuales.map(function (q) {
        return campoHTML('ind_' + slug(p) + '_' + q[0], q[1], { filas: 3, soloLectura: !mia, ph: mia ? 'Tu respuesta' : 'Solo ' + p + ' puede completar este espacio' });
      }).join('') + '</div>';
  }).join('');
  return '<article class="etapa">' +
    '<p class="etapa-num">Para terminar</p>' +
    '<h1>' + esc(e.titulo) + '</h1>' +
    '<p class="intro">Un cierre en dos partes: lo que se lleva el grupo y lo que se lleva cada integrante.</p>' +
    '<section class="bloque"><h2>Como grupo</h2>' +
      e.grupales.map(function (g, i) { return campoHTML(g[0], g[1], { num: i + 1, filas: 4 }); }).join('') +
    '</section>' +
    '<section class="bloque"><h2>Cada integrante</h2><p class="ayuda">Cada persona completa su parte. Las demás se pueden leer pero no editar.</p>' +
      (personas || '<p class="ayuda">Todavía no hay integrantes cargados.</p>') +
    '</section>' +
    '<section class="exportar"><h2>Descargar</h2>' +
      '<p class="ayuda">Se abre la ventana de impresión. En destino, elegí «Guardar como PDF».</p>' +
      '<div class="acciones"><button class="btn pet" data-imprimir="completo">Descargar bitácora completa (PDF)</button>' +
      '<button class="btn" data-imprimir="informe">Descargar informe (PDF)</button></div>' +
    '</section>' +
  '</article>';
}

function htmlNavegacion(n) {
  var izq = '', der = '';
  if (n > 1) izq = '<button class="btn" data-ir="' + (n - 1) + '">' + esc(nombreNav(n - 1)) + '</button>';
  if (n < ETAPAS.length) {
    der = '<button class="btn primario" data-ir="' + (n + 1) + '">' + (desbloqueada(n + 1) ? 'Seguir: ' : 'Abrir: ') + esc(nombreNav(n + 1)) + '</button>';
  }
  return '<nav class="nav-etapas" aria-label="Navegación entre etapas"><div>' + izq + '</div><div>' + der + '</div></nav>';
}
function nombreNav(n) { var e = etapa(n); return e.tipo === 'clase' ? 'Clase ' + n : e.titulo; }

/* ============ Informe: traer borrador ============ */
function traerBorrador(sec, n) {
  var e = etapa(n);
  var partes = [];
  (e.entrevista || []).forEach(function (p) {
    if (p[0] === 'c6_notas' && String(valor(p[0])).trim()) partes.push('Notas de la entrevista:\n' + valor(p[0]).trim());
  });
  e.preguntas.forEach(function (p) {
    var v = String(valor(p[0])).trim();
    if (v) partes.push(p[1] + '\n' + v);
  });
  var dejo = String(valor('c' + n + '_dejo')).trim();
  if (dejo) partes.push('Lo que nos dejó la clase:\n' + dejo);
  if (!partes.length) { toast('La clase ' + n + ' todavía no tiene respuestas para traer.'); return; }
  var t = campoEl(sec);
  if (!t) return;
  if (t.value.trim() && !window.confirm('Esta sección ya tiene texto. ¿Querés reemplazarlo por lo trabajado en la clase ' + n + '?')) return;
  t.value = partes.join('\n\n');
  autoAlto(t);
  marcarCambio(sec, t.value, Number(t.getAttribute('data-t')) || 0);
  t.focus();
  toast('Listo. Ahora reescríbanlo como un texto continuo.');
}

/* ============ Modales ============ */
function abrirModal(html, alCerrar) {
  modalRoot.innerHTML = '<div class="modal-fondo"><div class="modal" role="dialog" aria-modal="true"><button class="cerrar" aria-label="Cerrar">×</button>' + html + '</div></div>';
  var fondo = $('.modal-fondo', modalRoot);
  function cerrar() { modalRoot.innerHTML = ''; document.removeEventListener('keydown', tecla); if (alCerrar) alCerrar(); }
  function tecla(e) { if (e.key === 'Escape') cerrar(); }
  $('.cerrar', fondo).addEventListener('click', cerrar);
  fondo.addEventListener('mousedown', function (e) { if (e.target === fondo) cerrar(); });
  document.addEventListener('keydown', tecla);
  return { el: $('.modal', fondo), cerrar: cerrar };
}

function modalClave(n) {
  var e = etapa(n);
  var nombre = e.tipo === 'clase' ? 'la clase ' + n : 'el ' + e.titulo.toLowerCase();
  var m = abrirModal(
    '<h2>' + (e.tipo === 'clase' ? 'Clase ' + n + ': ' + esc(e.titulo) : esc(e.titulo)) + '</h2>' +
    '<p class="ayuda">' + (e.tipo === 'clase'
      ? 'La docente comparte la clave al comienzo de cada clase. Cuando alguien del grupo la ingresa, la clase se abre para todo el grupo.'
      : 'Esta etapa se abre junto con la clase 6. Ingresá la clave de la clase 6.') + '</p>' +
    '<label for="k-clave" style="display:block;font-weight:600;font-size:14px;margin:16px 0 6px">Clave</label>' +
    '<input id="k-clave" class="input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="PALABRA-00">' +
    '<p class="error" id="k-error" role="alert"></p>' +
    '<div class="acciones"><button class="btn primario" id="k-abrir">Abrir ' + esc(nombre) + '</button></div>'
  );
  var inp = $('#k-clave', m.el), btn = $('#k-abrir', m.el), err = $('#k-error', m.el);
  setTimeout(function () { inp.focus(); }, 50);
  function abrir() {
    if (!inp.value.trim()) { err.textContent = 'Ingresá la clave.'; return; }
    btn.disabled = true; btn.textContent = 'Verificando…';
    api('desbloquear', { clave: inp.value }).then(function (r) {
      if (r && r.ok) {
        S.des = (r.desbloqueadas || S.des).map(String);
        persistir();
        m.cerrar();
        var destino = Number(r.etapa);
        toast('Clave correcta. Se abrió la clase ' + destino + ' para todo el grupo.');
        S.etapa = desbloqueada(n) ? n : destino;
        pintarSendero(); pintarEtapa(); window.scrollTo(0, 0);
        return;
      }
      btn.disabled = false; btn.textContent = 'Abrir ' + nombre;
      if (r && r.error === 'clave') err.textContent = 'Esa clave no corresponde a ninguna clase. Revisala con la docente.';
      else if (r && r.error === 'acceso') { m.cerrar(); accesoInvalido(); }
      else err.textContent = 'El servidor está ocupado. Probá de nuevo en unos segundos.';
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Abrir ' + nombre;
      err.textContent = 'No hay conexión con el servidor. Revisá tu conexión y probá de nuevo.';
    });
  }
  btn.addEventListener('click', abrir);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') abrir(); });
  inp.addEventListener('input', function () { err.textContent = ''; });
}

function modalIntegrantes() {
  var m;
  function pintar() {
    var lista = integrantes();
    m.el.querySelector('#mi-cuerpo').innerHTML =
      '<ul class="lista-integ">' + lista.map(function (n, i) {
        return '<li><span>' + esc(n) + (n === S.autor ? ' <small style="color:var(--pet);font-weight:600">(vos)</small>' : '') + '</span><button data-quitar="' + i + '">Quitar</button></li>';
      }).join('') + '</ul>' +
      (lista.length ? '' : '<p class="ayuda">Todavía no hay integrantes.</p>');
    $$('[data-quitar]', m.el).forEach(function (b) {
      b.addEventListener('click', function () { quitar(lista[Number(b.getAttribute('data-quitar'))]); });
    });
  }
  function quitar(n) {
    if (!window.confirm('¿Quitar a ' + n + ' del grupo? Sus reflexiones de cierre no se borran.')) return;
    S.removidos[n] = true;
    var nueva = integrantes().filter(function (x) { return x !== n; });
    marcarCambio('integrantes', JSON.stringify(nueva), tsActual('integrantes'));
    if (S.pending.integrantes) S.pending.integrantes.forzar = true;
    programarGuardado(50);
    pintarGrupo();
    if (n === S.autor) { m.cerrar(); S.autor = null; persistir(); pantallaQuien(); return; }
    pintar();
    if (S.etapa === 8) pintarEtapa();
  }
  function agregar() {
    var inp = $('#mi-nombre', m.el);
    var n = inp.value.replace(/\s+/g, ' ').trim();
    if (n.length < 3) { $('#mi-error', m.el).textContent = 'Escribí nombre y apellido.'; return; }
    var lista = integrantes();
    if (lista.some(function (x) { return x.toLowerCase() === n.toLowerCase(); })) { $('#mi-error', m.el).textContent = 'Esa persona ya está en el grupo.'; return; }
    delete S.removidos[n];
    marcarCambio('integrantes', JSON.stringify(lista.concat([n])), tsActual('integrantes'));
    programarGuardado(50);
    inp.value = ''; $('#mi-error', m.el).textContent = '';
    pintar(); pintarGrupo();
    if (S.etapa === 8) pintarEtapa();
  }
  m = abrirModal(
    '<h2>Grupo ' + esc(S.grupo) + '</h2>' +
    '<label for="f-grupo_nombre" style="display:block;font-weight:600;font-size:14px;margin:14px 0 6px">Nombre del grupo (opcional)</label>' +
    '<textarea id="f-grupo_nombre" data-campo="grupo_nombre" data-t="' + tsActual('grupo_nombre') + '" rows="1" class="input" style="resize:none;min-height:46px" maxlength="60" placeholder="Por ejemplo: Equipo Transición">' + esc(valor('grupo_nombre')) + '</textarea>' +
    '<h3 style="margin:22px 0 0;font-size:16px">Integrantes</h3>' +
    '<div id="mi-cuerpo"></div>' +
    '<label for="mi-nombre" style="display:block;font-weight:600;font-size:14px;margin:6px 0 6px">Sumar a alguien</label>' +
    '<div class="fila"><input id="mi-nombre" class="input" maxlength="60" placeholder="Nombre y apellido"><button class="btn primario" id="mi-agregar">Sumar</button></div>' +
    '<p class="error" id="mi-error" role="alert"></p>',
    function () { pintarGrupo(); }
  );
  pintar();
  $('#mi-agregar', m.el).addEventListener('click', agregar);
  $('#mi-nombre', m.el).addEventListener('keydown', function (e) { if (e.key === 'Enter') agregar(); });
  $('#f-grupo_nombre', m.el).addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); });
}

function mostrarConflicto() {
  if (modalRoot.innerHTML || !S.conflictos.length) return;
  var c = S.conflictos.shift();
  var p = S.pending[c.campo];
  if (!p) { mostrarConflicto(); return; }
  var etiqueta = etiquetaCampo(c.campo);
  var m = abrirModal(
    '<h2>' + esc(c.a) + ' también editó esta respuesta</h2>' +
    '<p class="ayuda">' + esc(etiqueta) + '</p>' +
    '<p class="version-tit">Versión de ' + esc(c.a) + ' (' + esc(fechaCorta(c.t)) + ')</p><div class="version">' + esc(c.v || '(vacía)') + '</div>' +
    '<p class="version-tit">Tu versión</p><div class="version">' + esc(p.valor || '(vacía)') + '</div>' +
    '<div class="acciones">' +
      '<button class="btn primario" data-r="combinar">Combinar las dos</button>' +
      '<button class="btn" data-r="mia">Quedarme con la mía</button>' +
      '<button class="btn" data-r="suya">Usar la de ' + esc(c.a) + '</button>' +
    '</div>',
    function () {
      if (S.pending[c.campo] && S.pending[c.campo].conflicto) S.conflictos.unshift(c);
      estado();
      setTimeout(mostrarConflicto, 30000);
    }
  );
  $$('[data-r]', m.el).forEach(function (b) {
    b.addEventListener('click', function () {
      var r = b.getAttribute('data-r');
      var el = campoEl(c.campo);
      if (r === 'suya') {
        delete S.pending[c.campo];
        if (el) { el.value = c.v; el.setAttribute('data-t', c.t); autoAlto(el); }
      } else if (r === 'mia') {
        S.pending[c.campo] = { valor: p.valor, base: c.t, forzar: true };
      } else {
        var combinado = p.valor.trim() + '\n\n' + (c.v || '').trim();
        S.pending[c.campo] = { valor: combinado, base: c.t };
        if (el) { el.value = combinado; el.setAttribute('data-t', c.t); autoAlto(el); }
      }
      actualizarMeta(c.campo);
      persistir();
      m.cerrar();
      estado();
      programarGuardado(300);
      if (r === 'combinar') toast('Se juntaron las dos versiones. Revisen el texto para que quede unificado.', 5000);
      if (S.conflictos.length) setTimeout(mostrarConflicto, 400);
    });
  });
}

function etiquetaCampo(id) {
  for (var i = 0; i < ETAPAS.length; i++) {
    var e = ETAPAS[i];
    var listas = (e.preguntas || []).concat(e.entrevista || [], e.grupales || []);
    for (var j = 0; j < listas.length; j++) if (listas[j][0] === id) return (e.tipo === 'clase' ? 'Clase ' + e.n + '. ' : '') + listas[j][1];
    if (e.secciones) for (var k = 0; k < e.secciones.length; k++) if (e.secciones[k][0] === id) return 'Informe: ' + e.secciones[k][1];
  }
  if (/^c\d_dejo$/.test(id)) return 'Clase ' + id.charAt(1) + '. Lo que nos deja esta clase';
  if (id === 'inf_titulo') return 'Título del informe';
  if (id === 'grupo_nombre') return 'Nombre del grupo';
  return '';
}

/* ============ Exportación ============ */
function textoOVacio(id) {
  var v = String(valor(id)).trim();
  return v ? parrafosHTML(v) : '<p class="p-vacio">Sin respuesta.</p>';
}
function portada(titulo, sub) {
  var lista = integrantes();
  var nombre = valor('grupo_nombre');
  var hoy = new Date();
  var fecha = ('0' + hoy.getDate()).slice(-2) + '/' + ('0' + (hoy.getMonth() + 1)).slice(-2) + '/' + hoy.getFullYear();
  return '<section class="p-portada">' +
    '<div class="p-banda"><img src="' + LOGO + '" alt="Universidad Nacional de La Plata"></div>' +
    '<p class="p-materia">MBA, Recursos Humanos</p>' +
    '<h1>' + esc(titulo) + '</h1>' +
    '<p class="p-sub">' + esc(sub) + '</p>' +
    '<dl class="p-datos">' +
      '<div><dt>Grupo</dt><dd>Grupo ' + esc(S.grupo) + (nombre ? ': ' + esc(nombre) : '') + '</dd></div>' +
      '<div><dt>Integrantes</dt><dd>' + (lista.length ? lista.map(esc).join('<br>') : '—') + '</dd></div>' +
      '<div><dt>Docentes</dt><dd>' + esc(DOCENTES) + '</dd></div>' +
      '<div><dt>Fecha</dt><dd>' + fecha + '</dd></div>' +
    '</dl></section>';
}
function htmlInformeImpresion() {
  var e = etapa(7);
  return e.secciones.map(function (s) {
    var v = String(valor(s[0])).trim();
    return '<h2>' + esc(s[1]) + '</h2>' + (v ? parrafosHTML(v) : '<p class="p-vacio">Sección sin completar.</p>');
  }).join('');
}
function imprimir(tipo) {
  var h;
  var titulo = String(valor('inf_titulo')).trim();
  if (tipo === 'informe') {
    h = portada(titulo || 'Informe integrador', 'Informe integrador del caso Litoral Seguros') + htmlInformeImpresion();
  } else {
    h = portada('Bitácora del caso Litoral Seguros', 'Bitácora completa del grupo');
    ETAPAS.slice(0, 6).forEach(function (e) {
      h += '<section class="p-salto"><p class="p-num">Clase ' + e.n + '</p><h2 style="margin-top:4px">' + esc(e.titulo) + '</h2>';
      if (e.entrevista) {
        e.entrevista.forEach(function (p) { h += '<h3>' + esc(p[1]) + '</h3>' + textoOVacio(p[0]); });
      }
      e.preguntas.forEach(function (p, i) { h += '<h3>' + (i + 1) + '. ' + esc(p[1]) + '</h3>' + textoOVacio(p[0]); });
      h += '<h3>Lo que nos deja esta clase</h3>' + textoOVacio('c' + e.n + '_dejo') + '</section>';
    });
    h += '<section class="p-salto"><p class="p-num">Entrega final</p><h2 style="margin-top:4px">Informe integrador' + (titulo ? ': ' + esc(titulo) : '') + '</h2>' + htmlInformeImpresion() + '</section>';
    var ec = etapa(8);
    h += '<section class="p-salto"><p class="p-num">Para terminar</p><h2 style="margin-top:4px">Cierre de la materia</h2>';
    ec.grupales.forEach(function (g) { h += '<h3>' + esc(g[1]) + '</h3>' + textoOVacio(g[0]); });
    integrantes().forEach(function (p) {
      h += '<div class="p-persona"><h3 style="font-size:12pt">' + esc(p) + '</h3>';
      ec.individuales.forEach(function (q) { h += '<h3>' + esc(q[1]) + '</h3>' + textoOVacio('ind_' + slug(p) + '_' + q[0]); });
      h += '</div>';
    });
    h += '</section>';
  }
  document.getElementById('print').innerHTML = h;
  if (pendientesActivos().length) guardar();
  var img = document.querySelector('#print img');
  var lanzar = function () { setTimeout(function () { window.print(); }, 150); };
  if (img && !img.complete) { img.onload = lanzar; img.onerror = lanzar; } else lanzar();
}

function descargarRespaldo() {
  var datos = {
    bitacora: 'Caso Litoral Seguros, MBA UNLP, Recursos Humanos',
    grupo: S.grupo, nombre: valor('grupo_nombre'), integrantes: integrantes(),
    exportado: new Date().toISOString(),
    respuestas: {}
  };
  var todos = {};
  Object.keys(S.resp).forEach(function (k) { todos[k] = true; });
  Object.keys(S.pending).forEach(function (k) { todos[k] = true; });
  Object.keys(todos).sort().forEach(function (k) { datos.respuestas[k] = valor(k); });
  var blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bitacora-grupo-' + S.grupo + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Respaldo descargado.');
}

/* ============ Inicio ============ */
function iniciar() {
  var ses = lsGet(CLAVE + ':sesion');
  if (ses && ses.grupo && ses.codigo) {
    app.innerHTML = '<div class="cargando">Conectando con el grupo ' + esc(ses.grupo) + '…</div>';
    entrar(ses.grupo, ses.codigo).then(function (ok) { if (!ok && !$('#l-error')) pantallaIngreso(); });
  } else {
    pantallaIngreso();
  }
}
iniciar();

})();
